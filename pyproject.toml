[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
[project]
name = "litellm-codex-rpc"
version = "0.2.0"
description = "LiteLLM provider for an independently authenticated Codex App Server"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["litellm==1.80.7", "websockets==15.0.1"]
[project.optional-dependencies]
proxy = ["litellm[proxy]==1.80.7"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "build>=1,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
